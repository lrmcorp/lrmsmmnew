name: Test & Deploy

on:
  push:
    branches: [main, sosmed-generator]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lrmsmmnew-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install video test prerequisite
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            npm install --prefix "$RUNNER_TEMP/lrmsmm-video-tools" --no-save --ignore-scripts @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
            chmod +x "$RUNNER_TEMP/lrmsmm-video-tools/node_modules/@ffprobe-installer/linux-x64/ffprobe"
            echo "$RUNNER_TEMP/lrmsmm-video-tools/node_modules/@ffmpeg-installer/linux-x64" >> "$GITHUB_PATH"
            echo "$RUNNER_TEMP/lrmsmm-video-tools/node_modules/@ffprobe-installer/linux-x64" >> "$GITHUB_PATH"
          fi
      - run: npm ci
      - name: English UI and SVG-only icons
        run: |
          node scripts/check-ui-language.mjs
          node scripts/check-no-emoji.mjs
      - run: npm test
      - name: Browser workflow and responsive checks
        run: |
          npm install --prefix "$RUNNER_TEMP/lrmsmm-browser-tools" --no-save --ignore-scripts playwright@1.56.1
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/lrmsmm-browser-tools/node_modules/playwright" CHROMIUM_PATH="$(command -v google-chrome)" node --no-warnings test/redesign-browser.cjs
      - name: Upload browser review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redesign-browser-screenshots
          path: /tmp/redesign-*.png
          if-no-files-found: ignore
      - name: Deployment boundary and closed initial setup tests
        run: |
          python3 -m unittest discover -s deploy/tests -v
          node --no-warnings --test test/production-setup.js test/account-profile.js test/message-sync.js test/company-migration.js test/ai-images.js test/generator.js test/storytelling.js test/visual-production.js test/ui-helpers.js test/calendar-workspace.js test/audit-workspace.js test/brand-metadata.js test/dashboard.js test/story-memory-migration.js test/protected-composition.js test/account-specialist-session.js

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ghcr.io/lrmcorp/lrmsmmnew:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/lrmcorp/lrmsmmnew
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Test the actual non-root production image
        env:
          IMAGE: ghcr.io/lrmcorp/lrmsmmnew:${{ github.sha }}
        run: |
          docker run --rm --network none --mount "type=bind,src=$GITHUB_WORKSPACE/test,dst=/app/test,readonly" "$IMAGE" node --no-warnings test/e2e.js
          docker run --rm --network none --mount "type=bind,src=$GITHUB_WORKSPACE/test,dst=/app/test,readonly" "$IMAGE" node --no-warnings --test test/production-setup.js test/account-profile.js test/message-sync.js test/company-migration.js test/ai-images.js test/generator.js test/storytelling.js test/visual-production.js test/ui-helpers.js test/calendar-workspace.js test/audit-workspace.js test/brand-metadata.js test/dashboard.js test/story-memory-migration.js test/protected-composition.js test/account-specialist-session.js
      - name: Publish tested image
        id: publish
        env:
          IMAGE: ghcr.io/lrmcorp/lrmsmmnew:${{ github.sha }}
        run: |
          docker push "$IMAGE"
          echo "ref=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')" >> "$GITHUB_OUTPUT"
      - name: Deploy to the dedicated VPS receiver
        if: vars.ENABLE_VPS_DEPLOY == 'true'
        timeout-minutes: 21
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          APP_IMAGE: ${{ steps.publish.outputs.ref }}
          REGISTRY_ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 deploy/ssh-client.py
      - name: Verify public application health
        if: vars.ENABLE_VPS_DEPLOY == 'true'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 https://lrmsosmed.playgo.id/healthz
          curl --fail --silent --show-error --max-time 20 https://lrmsosmed.playgo.id/content-workspace.js -o /tmp/deployed-content-workspace.js
          cmp public/content-workspace.js /tmp/deployed-content-workspace.js
      - name: Deployment pending setup
        if: vars.ENABLE_VPS_DEPLOY != 'true'
        run: echo 'Image published. VPS deployment is disabled until its dedicated SSH secrets and ENABLE_VPS_DEPLOY=true are configured.' >> "$GITHUB_STEP_SUMMARY"
